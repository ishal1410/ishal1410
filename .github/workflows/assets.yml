name: Refresh profile assets

# The stats card states repository, star, and language counts, so it has to be
# regenerated or it slowly becomes a false claim. The default GITHUB_TOKEN is
# enough: everything read here is public.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_assets.py
      - scripts/snake.py
      - .github/workflows/assets.yml

permissions:
  contents: write

concurrency:
  group: refresh-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_assets.py

      - name: Build the contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/snake.py --user ishal1410 --theme amber --output assets/snake.svg

      - name: Commit if the numbers moved
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "assets unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh profile stats card and contribution snake"
          git push
