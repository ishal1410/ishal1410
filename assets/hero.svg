<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="ht hd">
<title id="ht">Vishal Patel, backend and machine learning engineer</title>
<desc id="hd">Name and role beside three measured results from this account: 3,632 of 3,632 IRS returns reconciled in ninetyninety, 177 tests that spend no API call in depositcheck, and 95.33 percent in-set against 75.00 percent cross-dataset accuracy in the deepfake detection project.</desc>
<rect width="1200" height="440" rx="20" fill="#0A0A0C"/>
<line x1="672" y1="70" x2="672" y2="406" stroke="#26262C" stroke-width="2"/>
<g><line x1="56" y1="92" x2="110" y2="92" stroke="#26262C" stroke-width="2"/><line x1="70" y1="85" x2="70" y2="99" stroke="#E0B252" stroke-width="2"/></g>
<text x="130" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#9B9BA4" letter-spacing="4">BACKEND AND MACHINE LEARNING</text>
<text x="56" y="196" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="#F4F2EE">Vishal Patel</text>
<text x="56" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="23" fill="#9B9BA4">I build production services and the models</text>
<text x="56" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="23" fill="#9B9BA4">behind them, then measure whether they hold.</text>
<text x="56" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#83848E">github.com/ishal1410</text>
<text x="736" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#9B9BA4" letter-spacing="4">MEASURED, NOT CLAIMED</text>
<text x="736" y="160" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#F4F2EE">3,632 / 3,632</text>
<text x="736" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" fill="#9B9BA4">IRS returns, total revenue rebuilt</text>
<text x="736" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#E0B252">ninetyninety</text>
<text x="736" y="256" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#F4F2EE">177</text>
<text x="736" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" fill="#9B9BA4">tests, none spending an API call</text>
<text x="736" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#E0B252">depositcheck</text>
<text x="736" y="352" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#F4F2EE">95.33% / 75.00%</text>
<text x="736" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" fill="#9B9BA4">in-set and cross-dataset</text>
<text x="736" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#E0B252">deepfake-detection</text>
